<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sobre as Ondas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #16304f;
    --navy-deep: #0e2138;
    --cream: #f6f0e2;
    --coral: #d8503c;
    --sand: #e7dcc2;
    --ink: #1c2530;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background: var(--cream);
    font-family:'DM Sans', sans-serif;
    color: var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }

  .phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background: var(--cream);
    position:relative;
    padding-bottom:60px;
  }

  /* top wave band */
  .top-band{
    background: var(--navy);
    position:relative;
    padding: 34px 24px 70px;
    text-align:center;
    overflow:hidden;
  }

  .top-band::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:46px;
    background: var(--cream);
    -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 60' preserveAspectRatio='none'><path d='M0,30 C150,60 350,0 500,25 C650,50 850,5 1000,30 L1000,60 L0,60 Z'/></svg>");
    mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 60' preserveAspectRatio='none'><path d='M0,30 C150,60 350,0 500,25 C650,50 850,5 1000,30 L1000,60 L0,60 Z'/></svg>");
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
  }

  .share-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 18px;
  }

  .icon-pill{
    width:38px; height:38px;
    border-radius:50%;
    background: rgba(255,255,255,0.12);
    display:flex; align-items:center; justify-content:center;
    color: var(--cream);
  }
  .icon-pill svg{width:17px; height:17px;}

  .avatar{
    width:132px; height:132px;
    border-radius:50%;
    margin: 6px auto 20px;
    background: #f6f0e2;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 24px rgba(0,0,0,0.25);
    border: 3px solid rgba(255,255,255,0.5);
    overflow:hidden;
  }

  .brand-script{
    font-family:'Caveat', cursive;
    font-size: 46px;
    font-weight:700;
    color: var(--cream);
    letter-spacing: 0.5px;
    line-height: 1;
  }

  .tagline{
    font-size: 15px;
    color: var(--sand);
    margin-top: 8px;
    letter-spacing: 0.3px;
  }

  /* links */
  .links{
    padding: 8px 22px 10px;
    display:flex;
    flex-direction:column;
    gap: 14px;
    margin-top: 8px;
  }

  .link-btn{
    background:#fff;
    border: 1px solid rgba(22,48,79,0.08);
    border-radius: 14px;
    padding: 18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-weight:600;
    font-size: 16.5px;
    color: var(--navy-deep);
    box-shadow: 0 2px 10px rgba(22,48,79,0.06);
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    user-select:none;
    -webkit-tap-highlight-color: transparent;
  }

  .link-btn:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(22,48,79,0.12);
  }

  .link-btn:active{
    transform: translateY(0px) scale(0.98);
  }

  .link-btn.featured{
    background: var(--coral);
    color: #fff;
    border-color: transparent;
  }

  .link-left{
    display:flex;
    align-items:center;
    gap: 12px;
  }

  .link-left svg{width:18px; height:18px; opacity:0.75;}
  .link-btn.featured .link-left svg{opacity:0.95;}

  .dots{
    width:18px; height:18px;
    opacity:0.35;
  }

  .social-row{
    display:flex;
    justify-content:center;
    gap: 18px;
    margin-top: 26px;
  }

  .social-circle{
    width:44px; height:44px;
    border-radius:50%;
    background: var(--navy);
    color: var(--cream);
    display:flex; align-items:center; justify-content:center;
  }
  .social-circle svg{width:20px; height:20px;}

  .footer-note{
    text-align:center;
    font-size: 12px;
    color: #9a9186;
    margin-top: 24px;
    padding: 0 30px;
    line-height:1.5;
  }

  .badge{
    position:fixed;
    bottom: 14px;
    left:50%;
    transform: translateX(-50%);
    background: var(--ink);
    color:#fff;
    font-size: 11.5px;
    padding: 7px 14px;
    border-radius: 999px;
    opacity:0;
    pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
    white-space:nowrap;
  }
  .badge.show{
    opacity:1;
    transform: translateX(-50%) translateY(-6px);
  }

  /* ===== MODAL DE CONFIRMAÇÃO (sair do site) ===== */
  .confirm-overlay{
    position:fixed;
    inset:0;
    background: rgba(14,33,56,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index: 500;
    padding: 24px;
  }
  .confirm-overlay.show{ display:flex; }
  .confirm-card{
    background:#f6f0e2;
    border-radius: 18px;
    max-width: 340px;
    width:100%;
    padding: 26px 24px 22px;
    text-align:center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .confirm-text{
    font-family:'DM Sans', sans-serif;
    font-size: 15.5px;
    color: var(--navy-deep);
    line-height:1.5;
    margin-bottom: 20px;
  }
  .confirm-actions{
    display:flex;
    justify-content:center;
    align-items:center;
    gap: 22px;
  }
  .confirm-cancel{
    background:none;
    border:none;
    font-family:'DM Sans', sans-serif;
    font-weight:600;
    font-size: 14.5px;
    color: var(--navy-deep);
    cursor:pointer;
  }
  .confirm-ok{
    background: var(--coral);
    color:#fff;
    border:none;
    font-family:'DM Sans', sans-serif;
    font-weight:700;
    font-size: 14.5px;
    padding: 11px 20px;
    border-radius: 999px;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="phone">

  <div class="top-band">
    <div class="share-row">
      <div class="icon-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.5 6.5L21 9l-5 4.5L17.5 21 12 17l-5.5 4L8 13.5 3 9l6.5-.5z"/></svg>
      </div>
      <div class="icon-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M16 6l-4-4-4 4M12 2v13"/></svg>
      </div>
    </div>

    <div class="avatar">
      <img src="logo.png" alt="Sobre as Ondas" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">
    </div>

    <div class="brand-script">@sobreasondas</div>
    <div class="tagline">O melhor lado da maré</div>
  </div>

  <div class="links">

    <a class="link-btn featured" href="reserva.html" style="text-decoration:none;">
      <div class="link-left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Reservas
      </div>
      <svg class="dots" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    </a>

    <a class="link-btn" href="cardapio.html" target="_blank" rel="noopener" style="text-decoration:none;">
      <div class="link-left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 012-2h9l5 5v11a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><path d="M8 8h5M8 12h8M8 16h8"/></svg>
        Cardápio
      </div>
      <svg class="dots" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    </a>

    <a class="link-btn" href="endereco.html" style="text-decoration:none;">
      <div class="link-left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        Endereço
      </div>
      <svg class="dots" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    </a>

  <a class="link-btn featured" href="pedidos.html" style="text-decoration:none;">
      <div class="link-left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Faça seu pedido
      </div>
      <svg class="dots" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
    </a>


  <div class="social-row">
    <a class="social-circle" href="https://www.instagram.com/sobreasondas__" target="_blank" rel="noopener" style="text-decoration:none;" onclick="return confirmarSaida(event, 'https://www.instagram.com/sobreasondas__', 'Você vai sair do nosso site e ir para o Instagram. Deseja continuar?')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
    </a>
  </div>

  <div class="footer-note">
   Conheça nosso quiosque pessoalmente, Clique em "Endereço" e venha participar de uma experiencia incrivel.
  </div>

<!-- MODAL DE CONFIRMAÇÃO -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-card">
    <div class="confirm-text" id="confirmText">Você vai sair do nosso site. Deseja continuar?</div>
    <div class="confirm-actions">
      <button class="confirm-cancel" onclick="fecharConfirm()">Cancelar</button>
      <button class="confirm-ok" id="confirmOkBtn">Sim, continuar</button>
    </div>
  </div>
</div>

<script>
  function showBadge(){
    const b = document.getElementById('badge');
    b.classList.add('show');
    clearTimeout(window._t);
    window._t = setTimeout(()=> b.classList.remove('show'), 1400);
  }

  let _urlPendente = null;

  function confirmarSaida(event, url, mensagem){
    event.preventDefault();
    _urlPendente = url;
    document.getElementById('confirmText').textContent = mensagem;
    document.getElementById('confirmOverlay').classList.add('show');
    return false;
  }

  function fecharConfirm(){
    document.getElementById('confirmOverlay').classList.remove('show');
    _urlPendente = null;
  }

  document.getElementById('confirmOkBtn').addEventListener('click', function(){
    if(_urlPendente){
      window.open(_urlPendente, '_blank', 'noopener');
    }
    fecharConfirm();
  });

  document.getElementById('confirmOverlay').addEventListener('click', function(e){
    if(e.target === this) fecharConfirm();
  });
</script>

</body>
</html>
